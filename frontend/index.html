        <h1>Subway Intel — Real-time NYC Subway Intelligence</h1>
        <p>Subway Intel is a live NYC subway dashboard for Midtown Manhattan, built on the MTA's GTFS-Realtime feeds. It shows real-time arrivals for saved and nearby stations, per-line network health, heuristic delay detection, a live track diagram, a map of stations and trains, and point-to-point trip planning. Operated by <a href="https://jamestannahill.com">James Tannahill</a>. This app requires JavaScript.</p>
